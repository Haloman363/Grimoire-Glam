name = "grimoire-glam-checkout"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Serves the worker at https://checkout.grimoireglam.com (needs the domain on the same Cloudflare account).
routes = [{ pattern = "checkout.grimoireglam.com", custom_domain = true }]

[vars]
SQUARE_LOCATION_ID = "L4YE869D48SSP"
# "false" = do not reject orders based on Square inventory counts (pairs with trackStock: false in config/site.json).
CHECK_STOCK = "false"
# Small-item shipping: carts made ONLY of items with "nail saver" in the name get this flat shipping fee (in cents) instead of the
# shop-wide rule. At $50 and over Square's free-shipping rule applies. Remove or empty SMALL_ITEM_SHIPPING_CENTS to turn this off.
SMALL_ITEM_SHIPPING_CENTS = "400"
SMALL_ITEM_MATCH = "nail saver"
SMALL_ITEM_FREE_OVER_CENTS = "5000"
# Comma separated: every address the storefront is served from (no trailing slash).
ALLOWED_ORIGINS = "https://grimoireglam.com,https://www.grimoireglam.com,https://haloman363.github.io"
# Where Square sends the customer after paying.
REDIRECT_URL = "https://grimoireglam.com/thank-you/"
# Optional instant-rebuild webhook (see README):
GITHUB_REPO = "haloman363/Grimoire-Glam"
SQUARE_WEBHOOK_URL = "https://checkout.grimoireglam.com/square-webhook"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put SQUARE_ACCESS_TOKEN
#   npx wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY   (optional)
#   npx wrangler secret put GITHUB_TOKEN                   (optional)
