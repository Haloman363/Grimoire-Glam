name = "grimoire-glam-checkout"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Serves the worker at https://checkout.grimmoiregalm.com (needs the domain on the same Cloudflare account).
routes = [{ pattern = "checkout.grimmoiregalm.com", custom_domain = true }]

[vars]
SQUARE_LOCATION_ID = "L4YE869D48SSP"
# Comma separated: every address the storefront is served from (no trailing slash).
ALLOWED_ORIGINS = "https://grimmoiregalm.com,https://www.grimmoiregalm.com,https://haloman363.github.io"
# Where Square sends the customer after paying.
REDIRECT_URL = "https://grimmoiregalm.com/thank-you/"
# Optional instant-rebuild webhook (see README):
GITHUB_REPO = "haloman363/Grimoire-Glam"
SQUARE_WEBHOOK_URL = "https://checkout.grimmoiregalm.com/square-webhook"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put SQUARE_ACCESS_TOKEN
#   npx wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY   (optional)
#   npx wrangler secret put GITHUB_TOKEN                   (optional)
