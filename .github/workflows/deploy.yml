name: Sync Square and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'          # pull new products / price / stock changes from Square every 30 min
  workflow_dispatch:                 # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [square-catalog-updated]  # fired by the Worker when Square reports a change (near-instant)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Sync catalog from Square
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SQUARE_ACCESS_TOKEN" ]; then
            echo "SQUARE_ACCESS_TOKEN secret not set - building from the committed data/products.json"
          else
            npm run sync
          fi

      - name: Commit catalog changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "grimoire-glam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data assets/img/products
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "chore: sync Square catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: |
          # Before a custom domain is connected the site lives at /<repo>/ ; with a CNAME it lives at the root.
          if [ ! -f CNAME ]; then export BASE_PATH="/${{ github.event.repository.name }}"; fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
